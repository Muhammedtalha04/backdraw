<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Backdraw</title>
  <defs>
    <linearGradient id="ghost" x1="0.85" y1="0.05" x2="0.05" y2="1">
      <stop offset="0" stop-color="#bba3ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="128" height="128" rx="28" fill="#0f0b18"/>
  <!-- the background tab -->
  <rect x="14" y="18" width="70" height="58" rx="10" fill="#d9d5e8"/>
  <rect x="20" y="35" width="58" height="35" rx="4" fill="#0f0b18"/>
  <circle cx="24.5" cy="26.5" r="3" fill="#0f0b18"/>
  <circle cx="33" cy="26.5" r="3" fill="#0f0b18"/>
  <circle cx="41.5" cy="26.5" r="3" fill="#0f0b18"/>
  <!-- ghost whose tail is a broad brush stroke -->
  <path d="M56 64 C56 47 68 36 84 36 C100 36 112 47 112 64 L112 82 C112 98 100 108 83 108 C68 108 50 111 26 121 L18 111 C33 104 46 96 53 86 C55 79 56 72 56 64 Z"
        fill="url(#ghost)" stroke="#0f0b18" stroke-width="4" stroke-linejoin="round" paint-order="stroke"/>
  <!-- bristles where the brush stroke ends -->
  <path d="M17 114 L9 117" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 119 L13 123" stroke="#6d28d9" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M15 109 L9 110" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- dry-brush highlight along the tail -->
  <path d="M34 110 C44 105 54 102 64 101" stroke="#d4c6ff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- eyes -->
  <ellipse cx="76" cy="64" rx="4.4" ry="6.6" fill="#0f0b18"/>
  <ellipse cx="93" cy="64" rx="4.4" ry="6.6" fill="#0f0b18"/>
</svg>
