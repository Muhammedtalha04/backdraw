<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Backdraw</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c391ff"/>
      <stop offset="0.6" stop-color="#b37af8"/>
      <stop offset="1" stop-color="#a669f2"/>
    </linearGradient>
    <clipPath id="ghost-clip">
      <path id="ghost-shape" d="M66 16 C85 16 95 31 96 49 C99 55 105 53 110 51 C119 48 122 59 115 64 C109 69 104 71 102 77 C104 87 109 96 107 104 C105 112 96 113 92 106 C88 113 79 117 74 108 C68 116 58 114 54 106 C48 112 38 111 30 105 C25 101 27 96 33 96 C40 94 42 87 41 80 C36 76 30 72 22 70 C13 68 13 57 22 55 C28 53 34 57 37 51 C38 31 48 16 66 16 Z"/>
    </clipPath>
  </defs>
  <!-- body -->
  <use href="#ghost-shape" fill="url(#body)" stroke="#6f3ccf" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- darker underside folds -->
  <g clip-path="url(#ghost-clip)" fill="#8b55e6">
    <path d="M20 96 C34 90 44 92 54 100 C60 92 70 92 76 100 C82 92 92 92 100 98 L112 120 L16 120 Z"/>
    <path d="M14 62 C20 66 28 68 36 64 L40 80 C30 74 22 72 14 70 Z" opacity="0.7"/>
    <path d="M114 58 C110 64 104 66 98 62 L102 78 C106 70 112 68 118 64 Z" opacity="0.7"/>
  </g>
  <!-- outline again on top so folds stay inside -->
  <use href="#ghost-shape" fill="none" stroke="#6f3ccf" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- glossy highlight -->
  <path d="M46 34 C49 26 54 22 60 20" stroke="#e6ccff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- eyes -->
  <ellipse cx="53" cy="51" rx="7.5" ry="9" fill="#1b1028"/>
  <ellipse cx="80" cy="51" rx="7.5" ry="9" fill="#1b1028"/>
  <circle cx="55.5" cy="48" r="2.6" fill="#f3e8ff"/>
  <circle cx="82.5" cy="48" r="2.6" fill="#f3e8ff"/>
  <!-- smile -->
  <path d="M60 63 C63 70 71 70 74 63 C70 65.5 64 65.5 60 63 Z" fill="#1b1028" stroke="#1b1028" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
